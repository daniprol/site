# Git hooks. Installed automatically by `pnpm install` (see the "prepare" script).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,ts,tsx,astro,json,jsonc,md,mdx,css,yml,yaml}"
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,ts,tsx,astro}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm check
    - name: build
      run: pnpm build
